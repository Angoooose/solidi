# Sources the pipeline ingests. Adding a Numishare corpus (CRRO, PELLA, SCO...)
# is a new entry under `corpora`, not new code.

nomisma:
  endpoint: https://nomisma.org/query        # GET only; POST returns 401
  dump: https://nomisma.org/nomisma.org.ttl  # concepts: people, mints, denominations...
  licence: CC BY 4.0

corpora:
  ocre:
    name: Online Coins of the Roman Empire
    dataset: http://numismatics.org/ocre/
    id_path: /ocre/id/                       # used to match type URIs and their variants
    licence: ODbL
    # legend_language: the corpus's main legend language (default 'la'); other scripts are detected.
    # Specimens are fetched in groups of type IDs; the regex's first group is the group key.
    # 'ric.2.tr.147' -> 'ric.2.' (about 20 groups).
    specimen_group: '^([^.]+\.[^.]+\.)'
    # Build only part of the corpus while iterating, e.g. `solidi build --authority trajan`.

  crro:
    name: Coinage of the Roman Republic Online
    dataset: http://numismatics.org/crro/
    id_path: /crro/id/
    licence: ODbL
    # 'rrc-414.1' -> 'rrc-4' (Crawford numbers by hundreds: about 6 groups).
    specimen_group: '^(rrc-\d)'

  # Hellenistic royal coinages (ANS). Specimens grouped by series and first character:
  # 'price.153' -> 'price.1', 'sc.1.1043.3' -> 'sc.1', 'newell.demetrius.1' -> 'newell.d'.
  pella:
    name: Coinage of the Macedonian Kings of the Argead Dynasty
    dataset: http://numismatics.org/pella/
    id_path: /pella/id/
    licence: ODbL
    specimen_group: '^([^.]+\.[^.])'
    legend_language: grc       # Latin look-alike text in these legends is Greek
  agco:
    name: Antigonid Coinage Online
    dataset: http://numismatics.org/agco/
    id_path: /agco/id/
    licence: ODbL
    specimen_group: '^([^.]+\.[^.])'
    legend_language: grc       # Latin look-alike text in these legends is Greek
  sco:
    name: Seleucid Coins Online
    dataset: http://numismatics.org/sco/
    id_path: /sco/id/
    licence: ODbL
    specimen_group: '^([^.]+\.[^.])'
    legend_language: grc       # Latin look-alike text in these legends is Greek
  pco:
    name: Ptolemaic Coins Online
    dataset: http://numismatics.org/pco/
    id_path: /pco/id/
    licence: ODbL
    specimen_group: '^([^.]+\.[^.])'
    legend_language: grc       # Latin look-alike text in these legends is Greek
  bigr:
    name: Bactrian and Indo-Greek Coinage
    dataset: https://numismatics.org/bigr/
    id_path: /bigr/id/
    licence: ODbL
    specimen_group: '^([^.]+\.[^.])'
    legend_language: grc       # Latin look-alike text in these legends is Greek

  # Greek city coinage, Archaic to Hellenistic (University of Oxford, ARCH / CHANGE projects).
  # IDs are mint + reference ('celenderis_kraay_1961_series_iv'): grouped by first letter.
  iris:
    name: IRIS typology of Greek coinage
    dataset: https://greekcoinage.org/iris/
    id_path: /iris/id/
    licence: ODbL
    specimen_group: '^([a-z0-9])'
    legend_language: grc

  # Greek civic and Roman provincial coinage of Thrace, Moesia, Mysia and the Troad (BBAW Berlin).
  # Types are '.../types/20453' or '.../types/cn.nicopolis_ad_nestum.1_ed.6': grouped by the
  # first two digits, or by 'cn.' and the city's first letter.
  # Licence CC BY-NC-SA 3.0: excluded from a commercial build. Monograms come from CN's API.
  cn:
    name: Corpus Nummorum
    dataset: https://www.corpus-nummorum.eu/
    id_path: corpus-nummorum.eu/types/
    licence: CC BY-NC-SA 3.0
    specimen_group: '^(\d\d?|cn\.[a-z0-9])'   # a few IDs are one digit; overlapping groups only fetch twice
    legend_language: grc

# Licence classification for the commercial switch. Matched as substrings of the
# dataset's licence URL; first match wins. Anything unmatched is treated as not
# commercial-safe until reviewed.
licence_rules:
  - match: publicdomain
    commercial_ok: true
  - match: cc0
    commercial_ok: true
  - match: "-nc"
    commercial_ok: false
  - match: /by-sa/
    commercial_ok: true
  - match: /by/
    commercial_ok: true
  - match: odbl
    commercial_ok: true
  - match: fdl
    commercial_ok: true

# Where an institution's image terms differ from its dataset licence.
# Keys are Nomisma dataset URIs.
image_overrides:
  http://numismatics.org/search/:
    image_licence: Public domain for objects made before 1925 (ANS statement; written confirmation pending)
    commercial_ok: true
  http://bnf.fr/:
    image_licence: Disputed; BnF charges for commercial reuse
    commercial_ok: false
  https://ikmk.smb.museum/:
    image_licence: CC BY-SA 4.0 on data; imprint reserves commercial image reproduction
    commercial_ok: false

# Names for holders whose Nomisma concept has no label. Keys are institution ids.
institution_names:
  roemisch_germanisches_museum_koeln: Römisch-Germanisches Museum Köln

# Source errors in a type's data, confirmed by hand. Keys are type URIs.
type_overrides:
  # Iris gives start 0520 (AD 520) and end -0519: the issue is 520–519 BC.
  https://greekcoinage.org/iris/id/samos_barron_1966_persian:
    start_year: -520

# Image hosts our pages can't show: their photos are kept but flagged image.usable = 0.
unusable_image_hosts:
  - host: gallica.bnf.fr
    reason: returned 403 to our pages in testing; revisit once BnF replies
  - host: kenom.de
    reason: its IIIF URLs redirect through an HTML response, which browsers block (ORB)
