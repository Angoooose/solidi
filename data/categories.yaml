# Collector categories: how collectors and dealers group ancient coins, independent of which
# catalogue a type comes from (Imperatorial coins sit inside RRC; posthumous Alexanders inside
# PELLA). Types are placed by `rules`, in order: the first rule that matches gives the type's
# primary category. A rule matches on any of:
#   dataset:      dataset slug from sources.yaml ('ocre')
#   work:         reference work ('ric', 'rrc', 'price1991')
#   authorities:  any of these Nomisma person or organisation IDs as authority
#   from_year / to_year: the type's dates fall inside this range (negative = BC)
# Every condition given must hold.

categories:
  - id: roman
    name: Roman
    children:
      - id: roman-republican
        name: Roman Republican
        description: Coinage of the Republic, from the first Roman issues (c. 300 BC) to the outbreak of civil war in 49 BC.
      - id: roman-imperatorial
        name: Roman Imperatorial
        description: >-
          Coinage of the civil wars, 49-27 BC: Caesar, Pompey and his sons, Brutus and Cassius,
          Antony, Lepidus and Octavian, and the moneyers who struck at Rome alongside them.
      - id: roman-imperial
        name: Roman Imperial
        description: Coinage of the emperors, from Augustus (27 BC) to the end of the western empire.

rules:
  - category: roman-imperial
    dataset: ocre
  # Imperatorial follows the collector convention (Sear, Roman Coins and their Values; Sear,
  # The History and Coinage of the Roman Imperators): everything RRC dates from 49 BC on.
  # RIC I already begins Octavian in 31 BC, so the last years overlap with OCRE by design.
  - category: roman-imperatorial
    dataset: crro
    from_year: -49
  - category: roman-republican
    dataset: crro
