# Collector categories: how collectors and dealers group ancient coins, independent of which
# catalogue a type comes from (Imperatorial coins sit inside RRC; posthumous Alexanders inside
# PELLA). Types are placed by `rules`, in order: the first rule that matches gives the type's
# primary category. A rule matches on any of:
#   dataset:      dataset slug from sources.yaml ('ocre')
#   work:         reference work ('ric', 'rrc', 'price1991')
#   authorities:  any of these Nomisma person or organisation IDs as authority
#   from_year / to_year: the type's dates fall inside this range (negative = BC)
#   to_start_year: the type began in or before this year
# Every condition given must hold.

categories:
  - id: greek
    name: Greek
    children:
      - id: archaic-classical
        name: Archaic and Classical
        description: Greek city coinage from the first coins (c. 630 BC) to the death of Alexander (323 BC).
      - id: hellenistic
        name: Hellenistic
        description: Coinage of the kingdoms that followed Alexander, from Philip II of Macedon (359 BC) to the Roman conquest of the East.
        children:
          - id: macedonian-kings
            name: Macedonian Kings
            description: >-
              The Argead kings Philip II, Alexander III and Philip III, with Lysimachus; includes
              the coins struck in Alexander's and Philip's names for centuries after their deaths.
          - id: antigonid
            name: Antigonid Kingdom
            description: Antigonus I, Demetrius Poliorcetes and their successors in Macedon.
          - id: seleucid
            name: Seleucid Kingdom
            description: Seleucus I to the end of the dynasty in 64 BC, from the Aegean to Bactria.
          - id: ptolemaic
            name: Ptolemaic Kingdom
            description: Ptolemy I to Cleopatra VII, Egypt and its overseas possessions.
          - id: bactrian-indo-greek
            name: Bactrian and Indo-Greek Kingdoms
            description: The Greek kings of Bactria and north-west India, c. 250 BC to the 1st century AD.
          - id: attalid
            name: Attalid Kingdom
            description: Philetaerus and the Attalid kings of Pergamon, 282-133 BC.
          - id: hellenistic-cities
            name: Cities and Leagues
            description: Civic and federal coinage of the Hellenistic world, alongside the kingdoms.
  - id: roman
    name: Roman
    children:
      - id: roman-republican
        name: Roman Republican
        description: Coinage of the Republic, from the first Roman issues (c. 300 BC) to the outbreak of civil war in 49 BC.
      - id: roman-imperatorial
        name: Roman Imperatorial
        description: >-
          Coinage of the civil wars, 49-27 BC: Caesar, Pompey and his sons, Brutus and Cassius,
          Antony, Lepidus and Octavian, and the moneyers who struck at Rome alongside them.
      - id: roman-provincial
        name: Roman Provincial
        description: >-
          Coinage struck by the cities and client kings of the Roman provinces under the emperors,
          mostly in Greek, alongside the imperial mints.
      - id: roman-imperial
        name: Roman Imperial
        description: Coinage of the emperors, from Augustus (27 BC) to the end of the western empire.

rules:
  # Hellenistic: by catalogue. Posthumous Alexanders and Philips stay under Macedonian Kings,
  # as Price files them; type_person marks them with role 'stated_authority'.
  - category: macedonian-kings
    dataset: pella
  - category: antigonid
    dataset: agco
  - category: seleucid
    dataset: sco
  - category: ptolemaic
    dataset: pco
  - category: bactrian-indo-greek
    dataset: bigr
  # Iris types by date: begun before Alexander's death (323 BC) are Archaic and Classical.
  # Corpus Nummorum: royal issues by their king, then by date like Iris; Roman-era city coins
  # (after 27 BC) are Roman Provincial.
  - category: macedonian-kings
    dataset: cn
    authorities: [lysimachus, alexander_iii, philip_ii, philip_iii]
  - category: attalid
    dataset: cn
    authorities: [philetaerus, eumenes_i, attalus_i, eumenes_ii, attalus_ii, attalus_iii]
  - category: roman-provincial
    dataset: cn
    from_year: -27
  - category: archaic-classical
    dataset: cn
    to_start_year: -324
  - category: hellenistic-cities
    dataset: cn
  - category: archaic-classical
    dataset: iris
    to_start_year: -324
  - category: hellenistic-cities
    dataset: iris
  - category: roman-imperial
    dataset: ocre
  # Imperatorial follows the collector convention (Sear, Roman Coins and their Values; Sear,
  # The History and Coinage of the Roman Imperators): everything RRC dates from 49 BC on.
  # RIC I already begins Octavian in 31 BC, so the last years overlap with OCRE by design.
  - category: roman-imperatorial
    dataset: crro
    from_year: -49
  - category: roman-republican
    dataset: crro
