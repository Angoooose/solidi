# Roman Imperial coin legend abbreviations: normalised legend segment -> full Latin + short English gloss.
#
# Used by the deterministic legend expander. Legends are normalised first (uppercase, single
# spaces, U->V, J->I). The expander matches `phrases` greedily (longest first) before `words`.
# Roman numerals are handled in code, not here; `numbered` says what a following numeral means.
#   kind:     title | name | epithet | formula | deity | personification | virtue | place | office | word
#   numbered: times (COS III) | year (TR P VII) | acclamation (IMP VI)
#   latin:    the written-out form the coin implies; the nominative where the abbreviation is ambiguous
#   lemma:    dictionary form when `latin` is inflected
#   note:     why an ambiguous abbreviation got this default
#   gender:   f on women's names; the expander then reads AVG as Augusta and F as filia
#
# Licence: our own work. Seeded with evidence from ocre-texts (Neel Smith), whose expanded OCRE
# legends are published under the ODbL; thanks to Neel Smith.
# Editorial tokens in OCRE (OR between variant legends, VNCLEAR LEGEND) are not legend words
# and are deliberately absent.

