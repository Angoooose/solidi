# Greek legends of the Roman Empire (struck after 31 BC), laid over greek.yaml.
#
# City coins of the eastern provinces give the emperor's titles in Greek, abbreviated much as
# Latin legends are: ΑΥΤ Κ Μ ΑΥΡ ΑΝΤΩΝΕΙΝΟΣ ΣΕΒ = Imperator Caesar Marcus Aurelius Antoninus
# Augustus. Single letters (Κ, Μ, Λ) only mean Καῖσαρ, Μᾶρκος, Λούκιος here; on Hellenistic
# coins they are control letters, so this overlay applies by date, like the Republican one.
#
# `ruler: true` marks the emperor's own names: when no person on the type is called that
# (ΑΝΤΩΝΕΙΝΟΣ on a coin of Caracalla), the word links to the type's authority.
# Licence: CC BY 4.0, our own work (data/LICENSE).

