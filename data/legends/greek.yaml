# Greek coin legends: normalised legend word -> written-out Greek + short English gloss.
#
# Keys are legends as the pipeline normalises them: uppercase Greek, no accents, Latin
# look-alikes folded (ANTIOXOY -> ΑΝΤΙΟΧΟΥ). Hellenistic royal legends are whole words in the
# genitive: '(coin) of King Antiochus, God Manifest' = ΒΑΣΙΛΕΩΣ ΑΝΤΙΟΧΟΥ ΘΕΟΥ ΕΠΙΦΑΝΟΥΣ.
# Epithets, not regnal numbers, tell same-named kings apart, so each epithet is glossed with
# its Greek name and meaning; the pipeline links name and epithet to the type's own ruler.
#
#   full:     the written-out word (accented Greek)
#   english:  short gloss; names are glossed by their English form
#   kind:     title | name | epithet | ethnic | place | word | formula
#   case:     gen on genitive names: a legend that opens with one reads '(coin) of ...'
#   gender:   f on queens
#
# Licence: CC BY 4.0, our own work (data/LICENSE).

