# Gandhari (Kharoshthi script) legends on Indo-Greek coins: transliterated word -> gloss.
#
# Keys are the pipeline's transliteration ('maharajasa tratarasa menadrasa'). The reverse
# legend translates the Greek obverse: maharajasa tratarasa = ΒΑΣΙΛΕΩΣ ΣΩΤΗΡΟΣ. Words end in
# the genitive -sa ('of'). `full` gives the Greek equivalent where there is one.
#
# Licence: CC BY 4.0, our own work (data/LICENSE).

phrases:
  "kavisiye nagara devata": {full: "kaviśiye nagaradevata", english: "the city deity of Kapisi", kind: formula}
  "putrasa casa": {full: "potrasa ca sa", english: "and of his grandson", kind: word, note: "Strato II with his grandson Strato III; read potrasa (Bopearachchi), the source writes pu-"}

